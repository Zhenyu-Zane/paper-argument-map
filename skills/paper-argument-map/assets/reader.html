<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><!--TITLE--></title><style>/*STYLE*/</style></head><body>
<header class="topbar"><a class="brand" href="#" id="home-view">Paper Argument Map <small>02</small></a><div class="header-actions"><div class="languages" aria-label="Language"><button id="lang-zh" lang="zh-CN">中文</button><button id="lang-en" lang="en">EN</button></div><details id="more-menu"><summary data-i18n="more">更多</summary><div class="menu"><button id="show-source" data-i18n="original"></button><button id="view-outline" data-i18n="outline"></button><button id="export-svg" data-i18n="exportSVG"></button><button id="export-html" data-i18n="exportHTML"></button><button id="export-json" data-i18n="exportJSON"></button><label class="import-label"><span data-i18n="importJSON"></span><input id="import-file" type="file" accept=".json,application/json"></label><label><input type="checkbox" id="show-excluded"><span data-i18n="excluded"></span></label></div></details></div></header>
<section class="paper-head"><div class="eyebrow" data-i18n="eyebrow"></div><h1 id="reading-title"></h1><details id="paper-info"><summary><span id="paper-meta"></span><span class="info-label" data-i18n="scope"></span></summary><div class="paper-info-body"><p id="paper-title"></p><p id="source-kind"></p><p id="input-scope"></p><p id="notice"></p><a id="paper-link" target="_blank" rel="noopener noreferrer" data-i18n="paperLink"></a><div id="warnings"></div></div></details></section>
<main id="reader-shell"><section class="map-panel"><div class="map-toolbar"><div class="view-tabs"><button id="view-map" data-i18n="main"></button><button id="view-full" data-i18n="full"></button></div><div class="map-tools"><button id="focus-chain" hidden data-i18n="focus"></button><button id="fit-view" data-i18n="fit"></button><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label"></span><button id="zoom-in" aria-label="Zoom in">+</button></div></div><div id="map-container"><svg id="graph" xmlns="http://www.w3.org/2000/svg" role="group"></svg></div><div id="outline" hidden></div><div class="map-caption"><span id="graph-count"></span><span data-i18n="mapHint"></span><span id="dirty-state"></span></div></section><aside id="inspector" hidden><div class="inspector-heading"><button id="tab-detail" data-i18n="evidence"></button><button id="tab-source" data-i18n="original"></button><button id="close-inspector" aria-label="Close">×</button></div><div id="detail"></div><div id="source-panel" hidden><input id="source-search" type="search"><div id="passages"></div><p id="attribution"></p></div></aside></main>
<div id="toast" role="status"></div><dialog id="edit-dialog"><form id="edit-form"><h2 data-i18n="edit"></h2><label id="summary-field"><span data-i18n="shortLabel"></span><textarea id="edit-summary" rows="2"></textarea></label><label id="label-field"><span data-i18n="fullLabel"></span><textarea id="edit-label" rows="3"></textarea></label><label><span data-i18n="statusLabel"></span><select id="edit-status"><option value="explicit" data-i18n="explicit"></option><option value="inferred" data-i18n="inferred"></option><option value="not_in_input" data-i18n="not_in_input"></option></select></label><label><span data-i18n="reason"></span><textarea id="edit-rationale" rows="3"></textarea></label><label><span data-i18n="notes"></span><textarea id="edit-note" rows="2"></textarea></label><p id="edit-error" role="alert"></p><div class="detail-actions"><button id="cancel-edit" type="button" data-i18n="cancel"></button><button type="submit" data-i18n="save"></button></div></form></dialog>
<script type="application/json" id="argument-data">/*DATA*/</script><script>/*LAYOUT*/</script><script>/*APP*/</script></body></html>
