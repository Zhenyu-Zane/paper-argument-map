<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Argument Map</title><style>
*{box-sizing:border-box}body{margin:0;color:#25302d;background:#fcfcf9;font:15px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}header,main,footer{max-width:1050px;margin:auto;padding:24px 32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e6e8e2;font-size:14px}button{border:0;background:transparent;color:#35634c;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#edf3e8;border-radius:4px}main{padding-top:48px}h1{font-size:34px;font-weight:600;margin:0 0 12px}main>p{color:#78827b;margin-bottom:36px;font-size:14px}.card{display:grid;grid-template-columns:40px 1fr 24px;gap:20px;align-items:center;padding:28px 0;border-top:1px solid #e6e8e2;color:inherit;text-decoration:none}.card:hover h2{color:#35634c}.card span{font-size:12px;color:#78827b}.card h2{font-size:20px;margin:0 0 7px;font-weight:550}.card p{font-size:12px;color:#78827b;margin:0}.card b{color:#35634c;font-weight:400}.help{font-size:13px;color:#78827b;border-top:1px solid #e6e8e2;padding-top:22px;margin-top:14px}.help summary{cursor:pointer;color:#35634c}footer{font-size:11px;color:#78827b}a{color:#35634c}code{color:#25302d}@media(max-width:600px){header,main,footer{padding-left:20px;padding-right:20px}main{padding-top:30px}h1{font-size:27px}.card{gap:10px;grid-template-columns:22px 1fr 16px}.card h2{font-size:18px}}
</style></head><body><header><strong>Paper Argument Map <small>03</small></strong><div><button id="zh" aria-pressed="true">中文</button><button id="en" aria-pressed="false">EN</button></div></header><main><h1 data-zh="先看懂研究主线。" data-en="Start with the paper’s main thread."></h1><p data-zh="先看主线，再看依据。通俗版与专业版随时切换。" data-en="Read the argument, then inspect its evidence. Switch between plain language and technical wording."></p><!--CARDS--><details class="help"><summary data-zh="使用说明与分析范围" data-en="How to use & analysis scope"></summary><p data-zh="点击节点或连线查看依据。修改后，在“更多”中保存报告或导出 JSON。" data-en="Click a claim or relation to inspect evidence. After editing, save the report or export JSON from More."></p><p><span data-zh="分析新论文：在 Codex 对话中使用 " data-en="For a new paper, use "></span><code>$paper-argument-map</code><span data-zh=" 并附上论文。" data-en=" in a Codex conversation and attach the paper."></span></p><p data-zh="这些样例仅分析摘要与引言，未经独立专家核验。原文匹配不代表论证有效或因果关系成立。" data-en="These examples analyze only the abstract and introduction and have not been independently verified by experts. Matching quotations do not establish valid arguments or causal identification."></p></details></main><footer><span data-zh="论文摘录保留原作者与 CC BY 许可。报告可离线使用。" data-en="Excerpts retain author attribution and CC BY licensing. Reports work offline."></span><br><a href="https://github.com/Zhenyu-Zane/paper-argument-map">GitHub</a> · <a href="paper-argument-map-skill.zip" data-zh="Skill 安装包" data-en="Skill package"></a></footer><script>
function language(l){document.documentElement.lang=l==='zh'?'zh-CN':'en';document.querySelectorAll('[data-zh]').forEach(x=>x.textContent=x.dataset[l]);for(const id of ['zh','en'])document.getElementById(id).setAttribute('aria-pressed',String(l===id));document.querySelectorAll('.card').forEach(a=>{a.href=a.dataset.file+'?lang='+l;});}document.getElementById('zh').onclick=()=>language('zh');document.getElementById('en').onclick=()=>language('en');language(new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en');
</script></body></html>
